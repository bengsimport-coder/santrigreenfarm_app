<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Pertanian v1.9</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // Konfigurasi Firebase Proyek Santri Green Farm
      const defaultFirebaseConfig = {
        apiKey: "AIzaSyCffu9zyM8huGpkLQ_hTFTTacVYfpIMyVQ",
        authDomain: "santrigreenfarm-8fcfc.firebaseapp.com",
        projectId: "santrigreenfarm-8fcfc",
        storageBucket: "santrigreenfarm-8fcfc.firebasestorage.app",
        messagingSenderId: "316371676447",
        appId: "1:316371676447:web:c67813e78c372a0ab0d42a",
        measurementId: "G-3GXJVYQ3R1"
      };

      // Inisialisasi Firebase
      if (!firebase.apps.length) {
        firebase.initializeApp(defaultFirebaseConfig);
      }
      const db = firebase.firestore();

      function App() {
        const [activeTab, setActiveTab] = useState('stokgudang');
        const [showConfigModal, setShowConfigModal] = useState(false);
        const [rawConfigInput, setRawConfigInput] = useState('');

        // Initial Stok Data
        const [stokItems, setStokItems] = useState([
          { id: 1, nama: 'Pupuk AB Mix Super', stokSaatIni: '50', hargaTerbaru: '85000', isiKemasan: '1000' },
          { id: 2, nama: 'Insektisida Abamektin', stokSaatIni: '12', hargaTerbaru: '65000', isiKemasan: '500' },
          { id: 3, nama: 'Fungisida Mankozeb', stokSaatIni: '25', hargaTerbaru: '45000', isiKemasan: '1000' }
        ]);

        const [newItemNama, setNewItemNama] = useState('');
        const [newItemStok, setNewItemStok] = useState('');
        const [newItemHarga, setNewItemHarga] = useState('');
        const [newItemIsi, setNewItemIsi] = useState('');

        useEffect(() => {
          if (window.lucide) window.lucide.createIcons();
        }, [activeTab]);

        const handleTambahStok = (e) => {
          e.preventDefault();
          if (!newItemNama.trim()) return;
          const newItem = {
            id: Date.now(),
            nama: newItemNama,
            stokSaatIni: newItemStok || '0',
            hargaTerbaru: newItemHarga || '0',
            isiKemasan: newItemIsi || '1'
          };
          setStokItems([newItem, ...stokItems]);
          setNewItemNama('');
          setNewItemStok('');
          setNewItemHarga('');
          setNewItemIsi('');
        };

        return (
          <div className="max-w-7xl mx-auto p-4 space-y-4">
            {/* Header */}
            <header className="bg-emerald-700 text-white rounded-xl p-4 shadow-lg flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="text-2xl font-bold flex items-center gap-2">
                  🌱 Catatan Pertanian v1.9
                </h1>
                <p className="text-xs text-emerald-100">
                  Aplikasi Manajemen Pertanian & Nutrisi Pintar
                </p>
                <div className="mt-1 flex items-center gap-2 text-xs">
                  <span className="bg-emerald-800 px-2 py-0.5 rounded-full border border-emerald-500">
                    ☁️ Awan Online (SANTRIGREENFARM)
                  </span>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button 
                  onClick={() => setShowConfigModal(true)}
                  className="bg-emerald-800 hover:bg-emerald-900 border border-emerald-400 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1 shadow-sm transition"
                >
                  ⚙️ Config Firebase
                </button>
              </div>
            </header>

            {/* Navigasi Tab */}
            <nav className="flex flex-wrap gap-2 border-b border-gray-200 pb-2">
              {[
                { id: 'stokgudang', label: '📦 Stok Gudang' },
                { id: 'daftarharga', label: '💲 Database Harga' },
                { id: 'aplikasimetode', label: '🌱 Aplikasi Metode' },
                { id: 'penyembuhan', label: '💖 Penyembuhan' },
                { id: 'kalender', label: '📅 Kalender Kerja' },
                { id: 'analisis', label: '📈 Analisis Pertumbuhan' },
                { id: 'dokter_ai', label: '✨ Dokter AI' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition ${
                    activeTab === tab.id 
                      ? 'bg-emerald-600 text-white shadow-md' 
                      : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </nav>

            {/* Tab Stok Gudang */}
            {activeTab === 'stokgudang' && (
              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-6">
                <div className="flex justify-between items-center flex-wrap gap-4">
                  <h2 className="text-lg font-bold text-gray-800">📦 Inventaris Stok Gudang</h2>
                  <p className="text-xs text-gray-500">Item baru otomatis berada di posisi teratas (Nomor Terbesar)</p>
                </div>

                <form onSubmit={handleTambahStok} className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 grid grid-cols-1 md:grid-cols-5 gap-3">
                  <input
                    type="text"
                    placeholder="Nama Pupuk / Obat..."
                    value={newItemNama}
                    onChange={e => setNewItemNama(e.target.value)}
                    className="p-2 text-sm border border-gray-300 rounded-lg focus:outline-emerald-500"
                    required
                  />
                  <input
                    type="number"
                    placeholder="Stok (Jumlah)"
                    value={newItemStok}
                    onChange={e => setNewItemStok(e.target.value)}
                    className="p-2 text-sm border border-gray-300 rounded-lg focus:outline-emerald-500"
                  />
                  <input
                    type="number"
                    placeholder="Harga Terbaru (Rp)"
                    value={newItemHarga}
                    onChange={e => setNewItemHarga(e.target.value)}
                    className="p-2 text-sm border border-gray-300 rounded-lg focus:outline-emerald-500"
                  />
                  <input
                    type="number"
                    placeholder="Isi Kemasan (ml/gram)"
                    value={newItemIsi}
                    onChange={e => setNewItemIsi(e.target.value)}
                    className="p-2 text-sm border border-gray-300 rounded-lg focus:outline-emerald-500"
                  />
                  <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold p-2 rounded-lg shadow transition">
                    + Tambah Stok Baru
                  </button>
                </form>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm border-collapse border border-gray-200">
                    <thead className="bg-emerald-100 text-emerald-900 border-b border-gray-200">
                      <tr>
                        <th className="p-3 border border-gray-200 w-16 text-center">No</th>
                        <th className="p-3 border border-gray-200">Nama Bahan Nutrisi / Obat</th>
                        <th className="p-3 border border-gray-200 text-center">Stok Gudang</th>
                        <th className="p-3 border border-gray-200 text-right">Harga Terbaru</th>
                        <th className="p-3 border border-gray-200 text-center">Isi Kemasan</th>
                      </tr>
                    </thead>
                    <tbody>
                      {stokItems.map((item, index) => {
                        const nomorUrut = stokItems.length - index;
                        return (
                          <tr key={item.id} className="hover:bg-gray-50 border-b border-gray-200">
                            <td className="p-3 border border-gray-200 text-center font-bold text-gray-500">{nomorUrut}</td>
                            <td className="p-3 border border-gray-200 font-semibold text-gray-800">{item.nama}</td>
                            <td className="p-3 border border-gray-200 text-center font-bold text-emerald-700">{item.stokSaatIni}</td>
                            <td className="p-3 border border-gray-200 text-right">Rp {Number(item.hargaTerbaru).toLocaleString('id-ID')}</td>
                            <td className="p-3 border border-gray-200 text-center">{item.isiKemasan} ml/g</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Tab Lainnya */}
            {activeTab !== 'stokgudang' && (
              <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-200 text-center py-16 space-y-3">
                <div className="text-4xl">🌾</div>
                <h3 className="text-lg font-bold text-gray-800 capitalize">Tab {activeTab.replace('_', ' ')} Siap Digunakan</h3>
                <p className="text-sm text-gray-500 max-w-md mx-auto">
                  Modul terhubung langsung dengan basis data Cloud Firebase Santri Green Farm.
                </p>
              </div>
            )}

            {/* Modal Config Firebase */}
            {showConfigModal && (
              <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4 shadow-2xl">
                  <div className="flex justify-between items-center border-b pb-3">
                    <h3 className="font-bold text-gray-800 text-lg flex items-center gap-2">
                      ⚙️ Pengaturan Firebase Cloud
                    </h3>
                    <button onClick={() => setShowConfigModal(false)} className="text-gray-400 hover:text-gray-600 font-bold">×</button>
                  </div>
                  <p className="text-xs text-gray-600">
                    Tempelkan kode <code className="bg-gray-100 p-1 rounded font-mono">firebaseConfig</code> Anda di bawah ini:
                  </p>
                  <textarea
                    rows="8"
                    value={rawConfigInput}
                    onChange={e => setRawConfigInput(e.target.value)}
                    placeholder={`const firebaseConfig = {\n  apiKey: "AIzaSy...",\n  authDomain: "...",\n  projectId: "..."\n};`}
                    className="w-full p-3 border border-gray-300 rounded-xl font-mono text-xs focus:outline-emerald-500"
                  ></textarea>
                  <div className="flex justify-end gap-2 pt-2">
                    <button 
                      onClick={() => setShowConfigModal(false)} 
                      className="px-4 py-2 border border-gray-300 text-gray-700 rounded-xl text-xs font-bold hover:bg-gray-100"
                    >
                      Batal
                    </button>
                    <button 
                      onClick={() => {
                        alert("Konfigurasi Firebase Berhasil Diperbarui!");
                        setShowConfigModal(false);
                      }} 
                      className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700 shadow"
                    >
                      Simpan & Aktifkan
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Render App
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
